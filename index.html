<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhein & Waal Pegel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 15px; background-color: #f0f4f8; color: #2d3748; }
        h1 { font-size: 22px; text-align: center; color: #2b6cb0; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        label { font-size: 14px; font-weight: 600; color: #4a5568; }
        button, select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 16px; background-color: #fff; appearance: none; }
        button { background-color: #3182ce; color: white; border: none; font-weight: 600; margin-top: 15px; }
        button:active { background-color: #2b6cb0; }
        canvas { width: 100% !important; max-height: 250px; margin-top: 20px; }
        .status { text-align: center; font-size: 13px; margin-top: 10px; color: #718096; }
        .level-text { font-size: 32px; font-weight: bold; color: #2b6cb0; margin: 5px 0 0 0; }
        .station-title { font-size: 18px; margin: 0; color: #1a202c; }
        .section-title { font-size: 15px; font-weight: 600; color: #4a5568; margin: 22px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid #edf2f7; }
        .data-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f7fafc; font-size: 15px; }
        .data-row:last-child { border-bottom: none; }
        .data-val { font-weight: 600; color: #2d3748; }
        .forecast-val { font-weight: 600; color: #dd6b20; }
        .empty-note { font-size: 13px; color: #718096; padding: 5px 0; }
    </style>
</head>
<body>
    <h1>Pegelmonitor</h1>

    <div class="card">
        <label for="stationSelect">Messstation auswählen</label>
        <select id="stationSelect">
            <option value="">Lade Stationen...</option>
        </select>
        <button id="btnLocation">Nächsten Pegel über GPS finden</button>
        <div id="statusText" class="status">Verbinde mit Pegelonline...</div>
    </div>

    <div class="card" id="dataCard" style="display:none;">
        <h2 id="stationName" class="station-title"></h2>
        <p id="currentLevel" class="level-text"></p>
        <canvas id="levelChart"></canvas>

        <div class="section-title">Rückschau (jeweils ca. 12:00 Uhr)</div>
        <div id="historyList"></div>

        <div class="section-title">Prognose (jeweils ca. 12:00 Uhr)</div>
        <div id="forecastList"></div>
    </div>

    <script>
        let stations = [];
        let chartInstance = null;

        async function init() {
            try {
                const response = await fetch('https://pegelonline.wsv.de/webservices/rest-api/v2/stations.json?water=RHEIN');
                stations = await response.json();
                populateSelect();
                document.getElementById('statusText').innerText = "Bereit. Bitte Station wählen oder GPS nutzen.";
            } catch (error) {
                document.getElementById('statusText').innerText = "Fehler beim Abrufen der Pegelstationen.";
            }
        }

        function populateSelect() {
            const select = document.getElementById('stationSelect');
            select.innerHTML = '<option value="">Manuelle Auswahl...</option>';
            stations.forEach(station => {
                const option = document.createElement('option');
                option.value = station.uuid;
                option.textContent = station.shortname + " (" + station.km + " km)";
                select.appendChild(option);
            });
            select.addEventListener('change', (event) => {
                if (event.target.value) {
                    loadStationData(event.target.value);
                }
            });
        }

        document.getElementById('btnLocation').addEventListener('click', () => {
            if (!navigator.geolocation) {
                document.getElementById('statusText').innerText = "Dein Gerät unterstützt keine GPS-Abfrage im Browser.";
                return;
            }
            document.getElementById('statusText').innerText = "Ermittle deinen aktuellen Standort...";
            navigator.geolocation.getCurrentPosition(position => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                let closestStation = null;
                let minDistance = Infinity;

                stations.forEach(station => {
                    if (station.latitude && station.longitude) {
                        const distance = calculateDistance(userLat, userLon, station.latitude, station.longitude);
                        if (distance < minDistance) {
                            minDistance = distance;
                            closestStation = station;
                        }
                    }
                });

                if (closestStation) {
                    document.getElementById('stationSelect').value = closestStation.uuid;
                    document.getElementById('statusText').innerText = "Nächste Station gefunden.";
                    loadStationData(closestStation.uuid);
                }
            }, error => {
                document.getElementById('statusText').innerText = "GPS-Zugriff wurde verweigert oder ist deaktiviert.";
            });
        });

        async function fetchForecastData(uuid, latestTimestamp) {
            const timeseriesCandidates = ['WV', 'W_V'];
            for (const ts of timeseriesCandidates) {
                try {
                    const url = `https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${uuid}/${ts}/measurements.json?start=P1D&end=P5D`;
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        const futureValues = data.filter(item => new Date(item.timestamp).getTime() > latestTimestamp);
                        if (futureValues.length > 0) {
                            return futureValues;
                        }
                    }
                } catch (e) {
                    continue;
                }
            }
            return [];
        }

        async function loadStationData(uuid) {
            document.getElementById('statusText').innerText = "Lade Wasserstände und Prognose...";
            try {
                const stationInfo = stations.find(s => s.uuid === uuid);
                const histResponse = await fetch(`https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${uuid}/W/measurements.json?start=P7D`);
                const measurements = await histResponse.json();
                
                const latestTimestamp = measurements.length > 0 ? new Date(measurements[measurements.length - 1].timestamp).getTime() : Date.now();
                const forecast = await fetchForecastData(uuid, latestTimestamp);

                if (measurements.length > 0) {
                    const latestValue = measurements[measurements.length - 1].value;
                    document.getElementById('stationName').innerText = stationInfo.shortname;
                    document.getElementById('currentLevel').innerText = latestValue + " cm";
                    document.getElementById('dataCard').style.display = 'block';
                    document.getElementById('statusText').innerText = "";
                    
                    renderChart(measurements, forecast);
                    renderDailyLists(measurements, forecast);
                }
            } catch (error) {
                document.getElementById('statusText').innerText = "Für diese Station liegen aktuell keine Messwerte vor.";
            }
        }

        function renderDailyLists(measurements, forecast) {
            const historyList = document.getElementById('historyList');
            const forecastList = document.getElementById('forecastList');
            historyList.innerHTML = '';
            forecastList.innerHTML = '';

            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            const pastByDay = {};
            measurements.forEach(m => {
                const d = new Date(m.timestamp);
                if (d < todayStart) {
                    const dayKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    const diffToNoon = Math.abs((d.getHours() * 60 + d.getMinutes()) - 720);
                    if (!pastByDay[dayKey] || diffToNoon < pastByDay[dayKey].diff) {
                        pastByDay[dayKey] = { date: d, value: m.value, diff: diffToNoon };
                    }
                }
            });

            // Chronologisch aufsteigend: Ältester Tag oben, aktuellster vergangener Tag unten
            const pastKeys = Object.keys(pastByDay).sort().slice(-5);
            if (pastKeys.length > 0) {
                pastKeys.forEach(key => {
                    const item = pastByDay[key];
                    const dateStr = item.date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                    historyList.innerHTML += `<div class="data-row"><span>${dateStr}</span><span class="data-val">${item.value} cm</span></div>`;
                });
            } else {
                historyList.innerHTML = '<div class="empty-note">Keine historischen Daten verfügbar.</div>';
            }

            const tomorrowStart = new Date(todayStart);
            tomorrowStart.setDate(tomorrowStart.getDate() + 1);

            const futureByDay = {};
            forecast.forEach(f => {
                const d = new Date(f.timestamp);
                if (d >= tomorrowStart) {
                    const dayKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    const diffToNoon = Math.abs((d.getHours() * 60 + d.getMinutes()) - 720);
                    if (!futureByDay[dayKey] || diffToNoon < futureByDay[dayKey].diff) {
                        futureByDay[dayKey] = { date: d, value: f.value, diff: diffToNoon };
                    }
                }
            });

            // Chronologisch aufsteigend: Tag 1 (morgen) oben bis Tag 5 unten
            const futureKeys = Object.keys(futureByDay).sort().slice(0, 5);
            if (futureKeys.length > 0) {
                futureKeys.forEach(key => {
                    const item = futureByDay[key];
                    const dateStr = item.date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                    forecastList.innerHTML += `<div class="data-row"><span>${dateStr}</span><span class="forecast-val">${item.value} cm</span></div>`;
                });
            } else {
                forecastList.innerHTML = '<div class="empty-note">Für diese Station berechnet das Amt aktuell keine Vorhersage.</div>';
            }
        }

        function renderChart(measurements, forecast) {
            const ctx = document.getElementById('levelChart').getContext('2d');
            
            // Zeitfenster für das Diagramm exakt auf gestern (00:00) bis morgen (23:59) eingrenzen
            const yesterdayStart = new Date();
            yesterdayStart.setDate(yesterdayStart.getDate() - 1);
            yesterdayStart.setHours(0, 0, 0, 0);

            const dayAfterTomorrowStart = new Date();
            dayAfterTomorrowStart.setDate(dayAfterTomorrowStart.getDate() + 2);
            dayAfterTomorrowStart.setHours(0, 0, 0, 0);

            const chartMeasurements = measurements.filter(m => new Date(m.timestamp) >= yesterdayStart);
            const chartForecast = forecast.filter(f => new Date(f.timestamp) < dayAfterTomorrowStart);

            const histLabels = chartMeasurements.map(d => {
                const date = new Date(d.timestamp);
                return date.toLocaleDateString('de-DE', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            });
            const foreLabels = chartForecast.map(d => {
                const date = new Date(d.timestamp);
                return date.toLocaleDateString('de-DE', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            });

            const allLabels = histLabels.concat(foreLabels);
            const histValues = chartMeasurements.map(d => d.value).concat(new Array(chartForecast.length).fill(null));
            
            let foreValues = new Array(chartMeasurements.length).fill(null);
            if (chartForecast.length > 0 && chartMeasurements.length > 0) {
                foreValues[chartMeasurements.length - 1] = chartMeasurements[chartMeasurements.length - 1].value;
                foreValues = foreValues.concat(chartForecast.map(d => d.value));
            }

            if (chartInstance) {
                chartInstance.destroy();
            }

            const datasets = [{
                label: 'Messwert (cm)',
                data: histValues,
                borderColor: '#3182ce',
                borderWidth: 2,
                pointRadius: 0,
                fill: true,
                backgroundColor: 'rgba(49, 130, 206, 0.1)'
            }];

            if (chartForecast.length > 0) {
                datasets.push({
                    label: 'Prognose (cm)',
                    data: foreValues,
                    borderColor: '#dd6b20',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                });
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { maxTicksLimit: 6 } }
                    },
                    plugins: {
                        legend: { display: chartForecast.length > 0 }
                    }
                }
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c;
        }

        init();
    </script>
</body>
</html>
