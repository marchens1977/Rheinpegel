<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rheinpegel</title>
    <meta name="theme-color" content="#002D72">
    <meta name="description" content="Aktuelle Wasserstände und Vorhersage für den Rhein">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rheinpegel">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <style>
        /* Farben: Blau und Orange (Mets-Stil) */
        :root {
            --blau: #002D72;
            --blau-hell: #1a4a9a;
            --blau-zart: #e8eef8;
            --orange: #FF5910;
            --orange-dunkel: #d94a0b;
            --text: #1b2433;
            --grau: #5b6577;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: #f2f5fa; color: var(--text); }
        header { background: var(--blau); color: #fff; padding: 18px 15px 16px; text-align: center; border-bottom: 5px solid var(--orange); }
        h1 { font-size: 24px; margin: 0; letter-spacing: 0.5px; }
        h1 span { color: var(--orange); }
        .subtitle { font-size: 13px; margin-top: 4px; color: #c9d6ee; }
        main { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,45,114,0.10); margin-bottom: 20px; border-top: 4px solid var(--blau); }
        label { font-size: 14px; font-weight: 600; color: var(--blau); }
        button, select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: 2px solid var(--blau); font-size: 16px; background-color: #fff; color: var(--text); appearance: none; }
        button { background-color: var(--orange); border-color: var(--orange); color: white; font-weight: 700; margin-top: 15px; cursor: pointer; }
        button:active { background-color: var(--orange-dunkel); }
        button.secondary { background-color: var(--blau); border-color: var(--blau); }
        button.secondary:active { background-color: var(--blau-hell); }
        canvas { width: 100% !important; max-height: 250px; margin-top: 20px; }
        .status { text-align: center; font-size: 13px; margin-top: 10px; color: var(--grau); }
        .level-text { font-size: 36px; font-weight: 800; color: var(--blau); margin: 5px 0 0 0; }
        .level-text::after { content: ""; display: block; width: 48px; height: 4px; background: var(--orange); border-radius: 2px; margin-top: 6px; }
        .station-title { font-size: 18px; margin: 0; color: var(--blau); }
        .list-container { margin-top: 25px; }
        .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e3e8f0; font-size: 15px; }
        .data-row:last-child { border-bottom: none; }
        .data-val { font-weight: 600; color: var(--text); }
        .forecast-val { font-weight: 700; color: var(--orange); }
        .current-val { font-weight: 800; color: #fff; font-size: 16px; }
        .current-row { background-color: var(--blau); color: #fff; border-radius: 8px; padding: 12px 10px; border-bottom: none; margin: 5px -10px; }
        .empty-note { font-size: 13px; color: var(--grau); padding: 15px 0; text-align: center; }
        .fallback-link { display: inline-block; margin-top: 10px; padding: 10px 15px; background-color: var(--blau-zart); color: var(--blau); text-decoration: none; border-radius: 10px; font-weight: 600; border: 2px solid var(--blau); }
        .legend { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--grau); margin-top: 8px; }
        .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; }
        /* Einstellungen */
        details.card { padding: 0; }
        details.card summary { list-style: none; cursor: pointer; padding: 15px; font-weight: 700; color: var(--blau); font-size: 16px; }
        details.card summary::-webkit-details-marker { display: none; }
        details.card summary::after { content: "▾"; float: right; color: var(--orange); }
        details.card[open] summary::after { content: "▴"; }
        .settings-body { padding: 0 15px 15px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e3e8f0; font-size: 15px; gap: 10px; }
        .setting-row strong { color: var(--blau); }
        .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider { position: absolute; inset: 0; background: #c3cbd8; border-radius: 30px; transition: .2s; cursor: pointer; }
        .switch .slider::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
        .switch input:checked + .slider { background: var(--orange); }
        .switch input:checked + .slider::before { transform: translateX(22px); }
        .switch input:focus-visible + .slider { outline: 3px solid var(--blau); outline-offset: 2px; }
        #updateStatus { text-align: left; font-size: 14px; color: var(--text); }
        .update-banner { background: var(--orange); color: #fff; text-align: center; padding: 10px 15px; font-size: 14px; font-weight: 600; }
        .update-banner button { width: auto; margin: 0 0 0 10px; padding: 6px 12px; background: #fff; color: var(--orange); border: none; font-size: 14px; }
        footer { text-align: center; font-size: 12px; color: var(--grau); padding: 0 15px 25px; }
        footer a { color: var(--blau); }
    </style>
</head>
<body>
    <header>
        <h1>Rhein<span>pegel</span></h1>
        <div class="subtitle">Wasserstände am Rhein – live von Pegelonline</div>
    </header>
    <div id="updateBanner" class="update-banner" style="display:none;">
        <span id="updateBannerText"></span>
        <button id="btnBannerUpdate" style="display:none;">Jetzt aktualisieren</button>
    </div>

    <main>
    <div class="card">
        <label for="stationSelect">Messstation auswählen</label>
        <select id="stationSelect">
            <option value="">Lade Stationen...</option>
        </select>
        <button id="btnLocation">Nächsten Pegel über GPS finden</button>
        <div id="statusText" class="status">Verbinde mit Pegelonline...</div>
    </div>

    <div class="card" id="dataCard" style="display:none;">
        <h2 id="stationName" class="station-title"></h2>
        <p id="currentLevel" class="level-text"></p>
        <canvas id="levelChart"></canvas>
        <div class="legend"><span><i style="background:#002D72"></i>Messwert</span><span><i style="background:#FF5910"></i>Prognose</span></div>
        <div id="combinedList" class="list-container"></div>
    </div>

    <div class="card" id="installCard" style="display:none;">
        <label>Rheinpegel als App</label>
        <div class="status" style="text-align:left">Lege Rheinpegel auf deinen Startbildschirm – dann öffnet sie sich wie eine normale App.</div>
        <button id="btnInstall" class="secondary">App installieren</button>
    </div>

    <details class="card" id="settingsCard">
        <summary>⚙️ Einstellungen</summary>
        <div class="settings-body">
            <div class="setting-row"><span>Installierte Version</span><strong id="appVersion">–</strong></div>
            <div class="setting-row">
                <label for="autoUpdate" style="font-weight:normal;color:inherit">Updates automatisch installieren</label>
                <label class="switch"><input type="checkbox" id="autoUpdate"><span class="slider"></span></label>
            </div>
            <div id="updateStatus" class="status">Update-Prüfung wird vorbereitet …</div>
            <button id="btnApplyUpdate" style="display:none;">Update jetzt installieren</button>
            <button id="btnCheckUpdate" class="secondary">Nach Update suchen</button>
        </div>
    </details>
    </main>

    <footer>Daten: <a href="https://www.pegelonline.wsv.de" target="_blank" rel="noopener">Pegelonline (WSV)</a></footer>

    <script>
        let stations = [];
        let chartInstance = null;

        async function init() {
            try {
                const response = await fetch('https://pegelonline.wsv.de/webservices/rest-api/v2/stations.json?water=RHEIN');
                const allStations = await response.json();
                
                stations = allStations
                    .filter(s => s.water && s.water.shortname && s.water.shortname.toUpperCase() === 'RHEIN')
                    .sort((a, b) => a.shortname.trim().localeCompare(b.shortname.trim(), 'de', { sensitivity: 'base' }));

                populateSelect();
                document.getElementById('statusText').innerText = "Bereit. Bitte Station wählen oder GPS nutzen.";

                // Zuletzt gewählten Pegel direkt wieder anzeigen
                const saved = loadSavedStation();
                if (saved && stations.some(s => s.uuid === saved)) {
                    document.getElementById('stationSelect').value = saved;
                    loadStationData(saved);
                }
            } catch (error) {
                document.getElementById('statusText').innerText = navigator.onLine === false
                    ? "Keine Internetverbindung. Bitte später erneut öffnen."
                    : "Fehler beim Abrufen der Pegelstationen.";
            }
        }

        const STORAGE_KEY = 'rheinpegel.station';
        function saveStation(uuid) {
            try { localStorage.setItem(STORAGE_KEY, uuid); } catch (e) {}
        }
        function loadSavedStation() {
            try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
        }

        function populateSelect() {
            const select = document.getElementById('stationSelect');
            select.innerHTML = '<option value="">Manuelle Auswahl...</option>';

            stations.forEach(station => {
                const option = document.createElement('option');
                option.value = station.uuid;
                option.textContent = station.shortname + " (" + station.km + " km)";
                select.appendChild(option);
            });
            select.addEventListener('change', (event) => {
                if (event.target.value) {
                    loadStationData(event.target.value);
                }
            });
        }

        document.getElementById('btnLocation').addEventListener('click', () => {
            if (!navigator.geolocation) {
                document.getElementById('statusText').innerText = "Dein Gerät unterstützt keine GPS-Abfrage.";
                return;
            }
            if (stations.length === 0) {
                document.getElementById('statusText').innerText = "Die Stationsliste ist noch nicht geladen. Bitte kurz warten.";
                return;
            }
            document.getElementById('statusText').innerText = "Suche Standort (max. 5 Sekunden)...";
            navigator.geolocation.getCurrentPosition(
                position => {
                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;
                    let closestStation = null;
                    let minDistance = Infinity;

                    stations.forEach(station => {
                        if (station.latitude && station.longitude) {
                            const distance = calculateDistance(userLat, userLon, station.latitude, station.longitude);
                            if (distance < minDistance) {
                                minDistance = distance;
                                closestStation = station;
                            }
                        }
                    });

                    if (closestStation) {
                        document.getElementById('stationSelect').value = closestStation.uuid;
                        document.getElementById('statusText').innerText = "Nächste Station gefunden.";
                        loadStationData(closestStation.uuid);
                    } else {
                        document.getElementById('statusText').innerText = "Keine Station mit Standortangabe gefunden. Bitte manuell wählen.";
                    }
                },
                error => {
                    document.getElementById('statusText').innerText = "Standort konnte nicht schnell genug ermittelt werden. Bitte manuell wählen.";
                }, 
                {
                    enableHighAccuracy: false,
                    timeout: 5000,
                    maximumAge: 600000
                }
            );
        });

        async function fetchForecastData(uuid, latestTimestamp) {
            try {
                const res = await fetch(`https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${uuid}/W/forecast.json`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.length > 0) {
                        const futureFromMain = data.filter(item => new Date(item.timestamp).getTime() > latestTimestamp);
                        if (futureFromMain.length > 0) return futureFromMain;
                    }
                }
            } catch (e) {}

            const timeseriesCandidates = ['WV', 'W_V'];
            for (const ts of timeseriesCandidates) {
                try {
                    const url = `https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${uuid}/${ts}/measurements.json`;
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        const futureValues = data.filter(item => new Date(item.timestamp).getTime() > latestTimestamp);
                        if (futureValues.length > 0) {
                            return futureValues;
                        }
                    }
                } catch (e) {
                    continue;
                }
            }
            return [];
        }

        async function loadStationData(uuid) {
            document.getElementById('statusText').innerText = "Lade Wasserstände und Prognose...";
            saveStation(uuid);
            try {
                const stationInfo = stations.find(s => s.uuid === uuid);
                const histResponse = await fetch(`https://pegelonline.wsv.de/webservices/rest-api/v2/stations/${uuid}/W/measurements.json?start=P7D`);
                const measurements = await histResponse.json();
                
                const latestTimestamp = measurements.length > 0 ? new Date(measurements[measurements.length - 1].timestamp).getTime() : Date.now();
                const forecast = await fetchForecastData(uuid, latestTimestamp);

                if (measurements.length > 0) {
                    const latestValue = measurements[measurements.length - 1].value;
                    document.getElementById('stationName').innerText = stationInfo.shortname;
                    document.getElementById('currentLevel').innerText = latestValue + " cm";
                    document.getElementById('dataCard').style.display = 'block';
                    document.getElementById('statusText').innerText = "";
                    
                    renderChart(measurements, forecast);
                    renderList(measurements, forecast, latestValue, stationInfo);
                }
            } catch (error) {
                document.getElementById('statusText').innerText = "Für diese Station liegen aktuell keine Messwerte vor.";
            }
        }

        function renderList(measurements, forecast, currentVal, stationInfo) {
            const list = document.getElementById('combinedList');
            list.innerHTML = '';
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const pastByDay = {};
            measurements.forEach(m => {
                const d = new Date(m.timestamp);
                if (d < today) {
                    const dayKey = d.toISOString().split('T')[0];
                    const diffToNoon = Math.abs((d.getHours() * 60 + d.getMinutes()) - 720);
                    if (!pastByDay[dayKey] || diffToNoon < pastByDay[dayKey].diff) {
                        pastByDay[dayKey] = { date: d, value: m.value, diff: diffToNoon };
                    }
                }
            });

            const pastKeys = Object.keys(pastByDay).sort().slice(-5);
            pastKeys.forEach(key => {
                const item = pastByDay[key];
                const dateStr = item.date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                list.innerHTML += `<div class="data-row"><span>${dateStr}</span><span class="data-val">${item.value} cm</span></div>`;
            });

            const currentStr = new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            list.innerHTML += `<div class="data-row current-row"><span>${currentStr} (Aktuell)</span><span class="current-val">${currentVal} cm</span></div>`;

            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const futureByDay = {};
            forecast.forEach(f => {
                const d = new Date(f.timestamp);
                if (d >= tomorrow) {
                    const dayKey = d.toISOString().split('T')[0];
                    const diffToNoon = Math.abs((d.getHours() * 60 + d.getMinutes()) - 720);
                    if (!futureByDay[dayKey] || diffToNoon < futureByDay[dayKey].diff) {
                        futureByDay[dayKey] = { date: d, value: f.value, diff: diffToNoon };
                    }
                }
            });

            const futureKeys = Object.keys(futureByDay).sort().slice(0, 5);
            if (futureKeys.length > 0) {
                futureKeys.forEach(key => {
                    const item = futureByDay[key];
                    const dateStr = item.date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                    list.innerHTML += `<div class="data-row"><span>${dateStr}</span><span class="forecast-val">${item.value} cm</span></div>`;
                });
            } else {
                const searchUrl = `https://www.google.de/search?btnI=1&q=Hochwasservorhersage+Pegel+${encodeURIComponent(stationInfo.shortname)}`;
                list.innerHTML += `<div class="empty-note">Pegelonline liefert hierfür keine Daten.<br><a href="${searchUrl}" target="_blank" class="fallback-link">Regionale Prognose öffnen</a></div>`;
            }
        }

        function renderChart(measurements, forecast) {
            const ctx = document.getElementById('levelChart').getContext('2d');
            
            const yesterdayStart = new Date();
            yesterdayStart.setDate(yesterdayStart.getDate() - 1);
            yesterdayStart.setHours(0, 0, 0, 0);

            const dayAfterTomorrowStart = new Date();
            dayAfterTomorrowStart.setDate(dayAfterTomorrowStart.getDate() + 2);
            dayAfterTomorrowStart.setHours(0, 0, 0, 0);

            const chartMeasurements = measurements.filter(m => new Date(m.timestamp) >= yesterdayStart);
            const chartForecast = forecast.filter(f => new Date(f.timestamp) < dayAfterTomorrowStart);

            let allData = [];
            chartMeasurements.forEach(m => allData.push({ x: new Date(m.timestamp), y: m.value, type: 'hist' }));
            
            if (chartForecast.length > 0 && chartMeasurements.length > 0) {
                const lastHist = chartMeasurements[chartMeasurements.length - 1];
                allData.push({ x: new Date(lastHist.timestamp), y: lastHist.value, type: 'fore' });
            }
            chartForecast.forEach(f => allData.push({ x: new Date(f.timestamp), y: f.value, type: 'fore' }));

            let lastDayStr = '';
            const labels = allData.map(d => {
                const dateStr = d.x.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                if (dateStr !== lastDayStr) {
                    lastDayStr = dateStr;
                    return dateStr;
                }
                return '';
            });

            const histValues = allData.map(d => d.type === 'hist' ? d.y : null);
            const foreValues = allData.map(d => d.type === 'fore' ? d.y : null);

            if (chartInstance) {
                chartInstance.destroy();
            }

            const datasets = [{
                label: 'Messwert',
                data: histValues,
                borderColor: '#002D72',
                borderWidth: 2,
                pointRadius: 0,
                fill: true,
                backgroundColor: 'rgba(0, 45, 114, 0.10)',
                spanGaps: true
            }];

            if (chartForecast.length > 0) {
                datasets.push({
                    label: 'Prognose',
                    data: foreValues,
                    borderColor: '#FF5910',
                    borderWidth: 3,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false,
                    spanGaps: true
                });
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: {
                                autoSkip: false,
                                maxRotation: 0,
                                font: { size: 11 },
                                callback: function(val, index) {
                                    return labels[index] || null;
                                }
                            },
                            grid: {
                                drawOnChartArea: true,
                                color: function(context) {
                                    if (context.tick && labels[context.index] !== '') {
                                        return '#d5dce8';
                                    }
                                    return 'transparent';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return R * c;
        }

        // --- Installierbare App (PWA) ---
        let installPrompt = null;
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            installPrompt = event;
            document.getElementById('installCard').style.display = 'block';
        });
        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (!installPrompt) return;
            installPrompt.prompt();
            await installPrompt.userChoice;
            installPrompt = null;
            document.getElementById('installCard').style.display = 'none';
        });
        window.addEventListener('appinstalled', () => {
            document.getElementById('installCard').style.display = 'none';
        });

        // --- Updates (über den Service Worker) ---
        const AUTO_KEY = 'rheinpegel.autoUpdate';
        function isAutoUpdate() {
            try { return localStorage.getItem(AUTO_KEY) !== 'aus'; } catch (e) { return true; }
        }
        function setAutoUpdate(on) {
            try { localStorage.setItem(AUTO_KEY, on ? 'an' : 'aus'); } catch (e) {}
        }

        let swReg = null;
        let reloading = false;
        let lastCheck = 0;
        const hadController = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;

        function setUpdateStatus(text) {
            document.getElementById('updateStatus').textContent = text;
        }
        function showBanner(text, withButton) {
            document.getElementById('updateBanner').style.display = text ? 'block' : 'none';
            document.getElementById('updateBannerText').textContent = text || '';
            document.getElementById('btnBannerUpdate').style.display = withButton ? 'inline-block' : 'none';
        }

        // Fragt einen Service Worker nach seiner Versionsnummer.
        function askVersion(worker) {
            return new Promise(resolve => {
                if (!worker) return resolve(null);
                const channel = new MessageChannel();
                const timer = setTimeout(() => resolve(null), 3000);
                channel.port1.onmessage = e => { clearTimeout(timer); resolve(e.data && e.data.version); };
                worker.postMessage({ type: 'GET_VERSION' }, [channel.port2]);
            });
        }

        async function showInstalledVersion() {
            const worker = navigator.serviceWorker.controller || (swReg && swReg.active);
            const v = await askVersion(worker);
            document.getElementById('appVersion').textContent = v ? 'Version ' + v : 'unbekannt';
        }

        function applyUpdate() {
            const worker = swReg && swReg.waiting;
            if (!worker) return;
            setUpdateStatus('Update wird installiert, die App startet gleich neu …');
            showBanner('Update wird installiert …', false);
            worker.postMessage({ type: 'SKIP_WAITING' });
        }

        async function onUpdateReady(worker) {
            const v = await askVersion(worker);
            const label = v ? 'Version ' + v : 'eine neue Version';
            if (isAutoUpdate()) {
                applyUpdate();
            } else {
                setUpdateStatus('Update verfügbar: ' + label + '.');
                document.getElementById('btnApplyUpdate').style.display = 'block';
                showBanner('Neues Update verfügbar.', true);
            }
        }

        function watchRegistration(reg) {
            if (reg.waiting && navigator.serviceWorker.controller) onUpdateReady(reg.waiting);
            reg.addEventListener('updatefound', () => {
                const worker = reg.installing;
                if (!worker) return;
                if (navigator.serviceWorker.controller) setUpdateStatus('Update wird heruntergeladen …');
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        onUpdateReady(worker);
                    } else if (worker.state === 'activated' && !hadController) {
                        showInstalledVersion();
                        setUpdateStatus('Die App ist aktuell und funktioniert jetzt auch ohne Internet.');
                    } else if (worker.state === 'redundant') {
                        setUpdateStatus('Update konnte nicht geladen werden. Bitte später erneut versuchen.');
                    }
                });
            });
        }

        async function checkForUpdate() {
            if (!swReg) return;
            lastCheck = Date.now();
            if (navigator.onLine === false) {
                setUpdateStatus('Keine Internetverbindung – Prüfung gerade nicht möglich.');
                return;
            }
            setUpdateStatus('Suche nach Updates …');
            try {
                await swReg.update();
                if (!swReg.installing && !swReg.waiting) {
                    const time = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                    setUpdateStatus('Die App ist aktuell (geprüft um ' + time + ' Uhr).');
                }
            } catch (e) {
                setUpdateStatus('Prüfung fehlgeschlagen. Bitte später erneut versuchen.');
            }
        }

        const autoBox = document.getElementById('autoUpdate');
        autoBox.checked = isAutoUpdate();
        autoBox.addEventListener('change', () => {
            setAutoUpdate(autoBox.checked);
            if (autoBox.checked && swReg && swReg.waiting) applyUpdate();
        });
        document.getElementById('btnCheckUpdate').addEventListener('click', checkForUpdate);
        document.getElementById('btnApplyUpdate').addEventListener('click', applyUpdate);
        document.getElementById('btnBannerUpdate').addEventListener('click', applyUpdate);

        if ('serviceWorker' in navigator) {
            // Neue Version ist aktiv -> Seite einmal neu laden, damit man sie sieht.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) return;
                reloading = true;
                location.reload();
            });
            window.addEventListener('load', async () => {
                try {
                    swReg = await navigator.serviceWorker.register('sw.js');
                    watchRegistration(swReg);
                    if (hadController) {
                        await showInstalledVersion();
                        if (!swReg.waiting) checkForUpdate();
                    } else {
                        // Erster Start: warten, bis die App gespeichert ist
                        await navigator.serviceWorker.ready;
                        await showInstalledVersion();
                        setUpdateStatus('Die App ist aktuell und funktioniert jetzt auch ohne Internet.');
                    }
                } catch (e) {
                    setUpdateStatus('Update-Funktion wird von diesem Browser nicht unterstützt.');
                }
            });
            // Beim Zurückkehren in die App und alle 30 Minuten nach Updates schauen.
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && Date.now() - lastCheck > 5 * 60 * 1000) checkForUpdate();
            });
            setInterval(checkForUpdate, 30 * 60 * 1000);
        } else {
            setUpdateStatus('Update-Funktion wird von diesem Browser nicht unterstützt.');
        }

        init();
    </script>
</body>
</html>
